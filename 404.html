<style>
  :root {
    --bg: #0B1210;
    --surface: #16211C;
    --ink: #F1EEE3;
    --ink-soft: #A7B4AC;
    --ink-faint: #6E7B73;
    --accent: #E0954C;
    --accent-strong: #F2AC66;
    --line: #223029;
    --line-strong: #33443A;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 18px 40px -20px rgba(0,0,0,0.65);
    --shadow-lift: 0 2px 6px rgba(0,0,0,0.5), 0 30px 60px -24px rgba(0,0,0,0.8);
    --serif: "Lora", Georgia, "Times New Roman", serif;
    --display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--serif); font-size: 17px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .grid-lines {
    position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background-image: repeating-linear-gradient(90deg, color-mix(in srgb, var(--ink) 6%, transparent) 0, color-mix(in srgb, var(--ink) 6%, transparent) 1px, transparent 1px, transparent 120px);
    mask-image: radial-gradient(circle at 50% 40%, black, transparent 75%);
  }
  .box { max-width: 480px; text-align: center; }
  .code {
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent-strong); margin: 0 0 18px;
  }
  h1 {
    font-family: var(--display); font-weight: 700; text-transform: uppercase;
    font-size: clamp(26px, 5vw, 34px); margin: 0 0 16px; text-wrap: balance;
  }
  p { color: var(--ink-soft); margin: 0 0 30px; }
  .btn {
    display: inline-flex; align-items: center; gap: 9px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.02em;
    padding: 13px 22px; border-radius: 999px; text-decoration: none; border: 1px solid var(--ink); color: var(--ink);
    background: var(--ink); color: var(--bg); box-shadow: var(--shadow);
    transition: background .18s ease, color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .btn::after { content: "\2192"; }
  .btn:hover { background: var(--accent-strong); color: #fff; transform: translateY(-2px); box-shadow: var(--shadow-lift); }
</style>

<div class="grid-lines" aria-hidden="true"></div>
<div class="box">
  <p class="code">Errore 404</p>
  <h1>Questa pagina non esiste, o si è spostata.</h1>
  <p>Il link che hai seguito potrebbe essere sbagliato o non più valido. Torna alla home per trovare quello che cerchi.</p>
  <a class="btn" href="https://automatia.studio/">Torna alla home</a>
</div>
